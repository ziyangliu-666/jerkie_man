<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5599ff"/>
      <stop offset="100%" style="stop-color:#3377dd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 透明背景 -->
  <rect width="32" height="32" fill="transparent"/>
  
  <!-- 发光效果 -->
  <rect x="4" y="4" width="24" height="24" rx="6" ry="6" 
        fill="url(#bodyGrad)" opacity="0.3" filter="url(#glow)"/>
  
  <!-- 玩家身体（圆角矩形） -->
  <rect x="4" y="4" width="24" height="24" rx="6" ry="6" 
        fill="url(#bodyGrad)" 
        stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
  
  <!-- 左眼 -->
  <circle cx="12" cy="15" r="2.5" fill="#1a1a2e"/>
  
  <!-- 右眼 -->
  <circle cx="20" cy="15" r="2.5" fill="#1a1a2e"/>
</svg>
